[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lasa-service"
version = "1.0.0"
description = "Workspace-bound LASA service using Codex App Server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "mcp>=1.20,<2",
  "psutil>=7,<8",
  "PyJWT[crypto]>=2.10,<3",
  "referencing>=0.37,<1",
  "rfc8785>=0.1.4,<1",
  "tomli-w>=1.2,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
lasa = "lasa_service.cli:main"
lasa-issue-jwt = "lasa_service.issue_jwt:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.setuptools]
packages = ["lasa_service", "lasa_contracts"]
package-dir = {lasa_service = "lasa_service", lasa_contracts = "design"}

[tool.setuptools.package-data]
lasa_service = ["config_defaults.json", "prompts.json"]
lasa_contracts = ["*.json", "examples/*.json", "standards/*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: runs the installed Codex executable or OS enclosure"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]
